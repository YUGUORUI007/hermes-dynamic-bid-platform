{% for item in projects %}
<a class="project-row" href="/projects/{{ item.id }}">
  <span class="project-name"><strong>{{ item.title }}</strong><small>{{ item.code }} · {{ item.tab_count }} 个动态标签</small></span>
  <span class="status-cell workflow-chips">{% for workflow in item.workflow_items %}<em class="status {{ workflow.tone }}" title="{{ workflow.label }}">{{ workflow.state_label }}</em>{% endfor %}</span>
  <span class="owner"><b class="mini-avatar">{{ item.owner[:1] }}</b>{{ item.owner }}</span>
  <span class="muted desktop-column">{{ format_datetime(item.updated_at) or '-' }}</span>
  <span class="open-link">查看 <i data-lucide="arrow-up-right"></i></span>
</a>
{% else %}
<div class="empty-state"><i data-lucide="folder-search"></i><strong>没有匹配的项目</strong><span>尝试调整筛选条件。</span></div>
{% endfor %}
